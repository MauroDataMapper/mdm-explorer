<dialog #dataDialog></dialog>

<!-- resizable divs -->
<div class="main-content">
  <div class="container medium-top-spacer">
    <div class="flex-container">
      <div class="flex-container__card">
        <mat-card class="header">
          <div class="header-content">
            <h2>{{ organisation.name }}</h2>
          </div>
          <p>
            {{ organisation.description }}
          </p>
        </mat-card>
        <div class="medium-top-spacer">
          <h2>Organisation Members</h2>
          <sde-list [data]="organisationMembers" [displayedColumns]="displayColumns"></sde-list>
          <div class="help-text mt-2">
            <i class="bi bi-info-circle-fill info-icon"></i>
            <span>
              The organisation members list displays all approvers and contacts at the selected
              organisation.
            </span>
          </div>
        </div>
        <!-- Display users department requests. -->
        <div class="medium-top-spacer">
          <sde-requests-list [useConfig]="requestsNeedingApprovalListConfig"></sde-requests-list>
          <div class="help-text mt-2">
            <i class="bi bi-info-circle-fill info-icon"></i>
            <span>
              A list of all organisation scoped requests that require approval at this organisation.
            </span>
          </div>
        </div>
        <!-- Display department scoped requests needing approval. -->
        <!-- <div *ngIf="userIsApproverForSelectedDepartment" class="medium-top-spacer">
            <sde-requests-list
              [useConfig]="requestsNeedingApprovalListConfig"
              [departmentId]="selectedDepartment.id"
            ></sde-requests-list>
            <div class="help-text mt-2">
              <i class="bi bi-info-circle-fill info-icon"></i>
              <span>
                A list of all department scoped requests that require approval at this department.
              </span>
            </div>
          </div> -->
      </div>
    </div>
  </div>
</div>
